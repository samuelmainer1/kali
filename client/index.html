<!doctype html>
<html lang="en">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BigDrop Kenya | Online Shopping Store in Kenya</title>

    <!-- SEO / social share (used when no page-level meta is available) -->
    <meta name="description" content="BigDrop Kenya — groceries, electronics, fashion, home & more, delivered by Globeflight across Kenya. Pay via M-Pesa." />
    <meta name="theme-color" content="#015837" />

    <meta property="og:title" content="BigDrop Kenya | Online Shopping Store in Kenya" />
    <meta property="og:description" content="Groceries, electronics, fashion, home & more, delivered by Globeflight across Kenya. Pay via M-Pesa." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.bigdrop.co.ke/" />
    <meta property="og:site_name" content="BigDrop Kenya" />
    <meta property="og:locale" content="en_KE" />
    <!-- Absolute URLs: WhatsApp/Facebook/X refuse to resolve relative image paths. -->
    <meta property="og:image" content="https://www.bigdrop.co.ke/share-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BigDrop Kenya | Online Shopping Store in Kenya" />
    <meta name="twitter:description" content="Groceries, electronics, fashion, home & more, delivered by Globeflight across Kenya. Pay via M-Pesa." />
    <meta name="twitter:image" content="https://www.bigdrop.co.ke/share-default.jpg" />

    <!-- Single-locale shop (Kenya English): a self-referencing hreflang pair, kept in
         lockstep with the canonical. The server's applyCanonical() rewrites the canonical
         AND both links per page; applyGenericOrigin() strips them from unknown paths.
         These shell values only matter for dev/static hosting of dist/ as-is. -->
    <link rel="alternate" hreflang="en-KE" href="https://www.bigdrop.co.ke/" />
    <link rel="alternate" hreflang="x-default" href="https://www.bigdrop.co.ke/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
